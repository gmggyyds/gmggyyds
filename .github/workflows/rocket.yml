# 每天把贡献格子生成一张动图，并把默认的贪吃蛇换成火箭。
# 产物推到 output 分支，README 直接引用那个 raw 链接。
name: rocket

on:
  schedule:
    - cron: "17 3 * * *"      # 每天 03:17 UTC（北京时间 11:17）
  workflow_dispatch:           # 也可以手动触发
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # 1) 生成原始贡献图（贪吃蛇）
      - name: Generate contribution grid
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/grid.svg
            dist/grid-dark.svg?palette=github-dark

      # 2) 把蛇换成火箭（只动蛇身，格子一根汗毛不碰，脚本会自证）
      - name: Turn the snake into a rocket
        run: |
          python3 scripts/rocketize.py dist/grid.svg      dist/github-contribution-grid-snake.svg
          python3 scripts/rocketize.py dist/grid-dark.svg dist/github-contribution-grid-snake-dark.svg
          rm -f dist/grid.svg dist/grid-dark.svg

      # 3) 推到 output 分支
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
